spring.application.name=aluguel-carros

# Carrega os segredos do arquivo backend/.env (rode o backend a partir da pasta backend/).
# O .env nunca vai para o Git; veja backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# ===== Banco de dados: Supabase (PostgreSQL) via Session pooler =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# O plano gratuito do Supabase limita conexões: pool pequeno.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
# O Supabase fica nos EUA (~150 ms por ida e volta): carrega relacionamentos em lote para evitar N+1.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ===== Segurança (JWT) =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

# ===== CORS (frontend React + Vite) =====
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

# ===== Servidor =====
server.port=${PORT:8080}
spring.jackson.time-zone=America/Sao_Paulo
